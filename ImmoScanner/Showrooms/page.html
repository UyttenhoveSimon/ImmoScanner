<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ImmoScanner</title>
<style>
  :root {
    color-scheme: light dark;
    --ground: #f4f5f7; --card: #ffffff; --sunk: #eef0f3;
    --ink: #111827; --dim: #4b5563; --faint: #6b7280; --line: #e2e5ea;
    --accent: #0f6b4f; --accent-ink: #ffffff; --accent-soft: #e3f1ea;
    --down: #0f6b4f; --up: #b42318;
    --shadow: 0 1px 2px rgb(17 24 39 / .06), 0 4px 16px rgb(17 24 39 / .05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #0e1014; --card: #161a20; --sunk: #1d222a;
      --ink: #eef1f5; --dim: #b4bcc8; --faint: #8b95a3; --line: #262c35;
      --accent: #4cc292; --accent-ink: #06261a; --accent-soft: #15302a;
      --down: #4cc292; --up: #f28b7d;
      --shadow: 0 1px 2px rgb(0 0 0 / .4);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--ground); color: var(--ink);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .num, td.n, th.n { font-variant-numeric: tabular-nums; text-align: right; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button, input, select { font: inherit; color: inherit; }

  /* frame */
  .top {
    position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 24px;
    padding: 0 20px; height: 56px; background: var(--card); border-bottom: 1px solid var(--line);
  }
  .brand { font-weight: 700; font-size: 17px; letter-spacing: -0.01em; color: var(--ink); }
  .brand span { color: var(--accent); }
  .brand:hover { text-decoration: none; }
  .tabs { display: flex; gap: 4px; }
  .tabs a { color: var(--dim); font-weight: 550; padding: 6px 12px; border-radius: 8px; }
  .tabs a:hover { background: var(--sunk); text-decoration: none; color: var(--ink); }
  .tabs a.on { background: var(--accent-soft); color: var(--accent); }
  .spacer { flex: 1; }
  .layout { display: grid; grid-template-columns: 260px minmax(0, 1fr); min-height: calc(100vh - 56px); }
  aside {
    border-right: 1px solid var(--line); background: var(--card); padding: 16px 12px;
    position: sticky; top: 56px; height: calc(100vh - 56px); overflow-y: auto;
  }
  main { padding: 28px 32px 64px; max-width: 1180px; width: 100%; }

  /* sidebar */
  .find { width: 100%; margin-bottom: 6px; }
  .group { font-size: 12px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase;
           color: var(--faint); margin: 16px 10px 6px; }
  .place {
    display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
    padding: 7px 10px; border-radius: 8px; color: var(--ink);
  }
  .place:hover { background: var(--sunk); text-decoration: none; }
  .place.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .place small { color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }

  /* type */
  h1 { font-size: 28px; line-height: 1.2; letter-spacing: -0.02em; margin: 0 0 4px; }
  h2 { font-size: 17px; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--dim); margin: 0 0 24px; }
  .crumb { color: var(--faint); font-size: 13px; margin-bottom: 6px; }

  /* surfaces */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
  .card-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
               padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .scroll { overflow-x: auto; }
  .note { color: var(--dim); font-size: 14px; padding: 16px 18px 4px; margin: 0; max-width: 78ch; }

  /* tables */
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 11px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; text-align: left; }
  th { font-size: 12px; font-weight: 650; color: var(--faint); letter-spacing: .03em; text-transform: uppercase; }
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { color: var(--ink); }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr.go { cursor: pointer; }
  tbody tr.go:hover { background: var(--sunk); }
  td .second { display: block; color: var(--faint); font-size: 13px; }
  td.wrap { white-space: normal; min-width: 220px; }
  .dash { color: var(--faint); }
  .empty { color: var(--dim); padding: 32px 18px; text-align: center; }

  /* bits */
  .bar { height: 8px; border-radius: 4px; background: var(--accent); min-width: 2px; }
  .bar.pale { background: color-mix(in srgb, var(--accent) 35%, transparent); }
  .tag { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px;
         background: var(--sunk); color: var(--dim); }
  .tag.new { background: var(--accent-soft); color: var(--accent); }
  .tag.gone { text-decoration: line-through; }
  .down { color: var(--down); font-weight: 600; } .up { color: var(--up); font-weight: 600; }
  .best { color: var(--accent); font-weight: 700; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .tile { padding: 16px 18px; }
  .tile .k { font-size: 13px; color: var(--dim); }
  .tile .v { font-size: 26px; font-weight: 650; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .tile .h { font-size: 13px; color: var(--faint); }

  .seg { display: inline-flex; background: var(--sunk); border-radius: 10px; padding: 3px; gap: 2px; }
  .seg a, .seg button { border: 0; background: none; padding: 6px 14px; border-radius: 8px;
                        color: var(--dim); font-weight: 600; cursor: pointer; }
  .seg a:hover, .seg button:hover { color: var(--ink); text-decoration: none; }
  .seg .on { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
  .seg .off { opacity: .45; pointer-events: none; }

  input, select { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 11px; }
  input:disabled { opacity: .5; }
  input:focus, select:focus, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .primary { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px;
             padding: 8px 14px; font-weight: 650; cursor: pointer; }
  .primary[disabled] { opacity: .55; cursor: default; }
  .ghost { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px;
           cursor: pointer; color: var(--dim); }

  /* scan dialog and listing drawer */
  dialog { border: 1px solid var(--line); border-radius: 14px; padding: 0; background: var(--card);
           color: var(--ink); box-shadow: 0 20px 60px rgb(0 0 0 / .25); width: min(460px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgb(15 17 21 / .45); }
  .dlg { padding: 22px; display: grid; gap: 14px; }
  .dlg label { display: grid; gap: 5px; font-size: 13px; color: var(--dim); font-weight: 600; }
  .dlg .actions { display: flex; justify-content: flex-end; gap: 8px; }
  #progress { font-size: 14px; color: var(--dim); }
  #progress.fail { color: var(--up); }
  .status { font-size: 13px; color: var(--faint); }

  .drawer { position: fixed; inset: 0 0 0 auto; width: min(420px, 100vw); z-index: 10;
            background: var(--card); border-left: 1px solid var(--line); box-shadow: -10px 0 40px rgb(0 0 0 / .15);
            padding: 22px; overflow-y: auto; transform: translateX(105%); transition: transform .2s ease; }
  .drawer.open { transform: none; }
  .facts { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin: 16px 0; }
  .facts dt { color: var(--faint); } .facts dd { margin: 0; font-variant-numeric: tabular-nums; }
  .hist td { padding: 7px 0; }

  .lang { padding: 6px 8px; font-size: 14px; color: var(--dim); }

  /* map */
  .controls { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  #map { height: min(600px, calc(100vh - 300px)); min-height: 360px; border-radius: 12px 12px 0 0; background: var(--sunk); }
  .leaflet-container { font: inherit; }
  .leaflet-container .leaflet-tooltip { background: var(--card); color: var(--ink); border: 1px solid var(--line);
                     border-radius: 8px; box-shadow: var(--shadow); padding: 8px 10px; font-size: 13px; }
  .leaflet-container .leaflet-tooltip-top:before { border-top-color: var(--card); }
  .leaflet-control-attribution { font-size: 11px; }
  /* A grey basemap, so the only colour on the map is the price. */
  .leaflet-tile-pane { filter: grayscale(1) contrast(.85) brightness(1.04); }
  @media (prefers-color-scheme: dark) {
    /* OpenStreetMap only draws light tiles; turned over, they sit in the dark page. */
    .leaflet-tile-pane { filter: grayscale(1) invert(1) brightness(.8) contrast(.85); }
  }
  .legend { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 12px 16px;
            border-top: 1px solid var(--line); font-size: 13px; color: var(--dim); }
  .legend b { color: var(--ink); font-weight: 600; }
  .key { display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
  .key i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }

  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
    aside { position: static; height: auto; max-height: 220px; border-right: 0; border-bottom: 1px solid var(--line); }
    main { padding: 20px 16px 48px; }
    .top { gap: 12px; padding: 0 16px; }
    .tabs a { padding: 6px 8px; }
    .status { display: none; }
    h1 { font-size: 23px; }
  }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#/">Immo<span>Scanner</span></a>
  <nav class="tabs">
    <a href="#/" data-tab="places" data-t="nav.places"></a>
    <a href="#/yield" data-tab="yield" data-t="nav.yield"></a>
    <a href="#/map" data-tab="map" data-t="nav.map"></a>
  </nav>
  <span class="spacer"></span>
  <span class="status" id="status"></span>
  <select class="lang" id="lang" aria-label="Language"></select>
  <button class="primary" id="open-scan" data-t="scan.open"></button>
</header>

<div class="layout">
  <aside>
    <input class="find" id="find" data-t-placeholder="side.find">
    <nav id="side"></nav>
  </aside>
  <main id="view"></main>
</div>

<div class="drawer" id="drawer" aria-hidden="true"></div>

<dialog id="scan">
  <form class="dlg" id="add">
    <h2 data-t="scan.title"></h2>
    <label><span data-t="scan.country"></span> <select id="country"></select></label>
    <label><span data-t="scan.town"></span> <input id="place"></label>
    <label><span data-t="scan.region"></span> <select id="region"></select></label>
    <label><span data-t="scan.type"></span> <select id="kind"></select></label>
    <div><div class="seg" role="radiogroup">
      <button type="button" class="on" data-deal="buy" data-t="deal.buy"></button>
      <button type="button" data-deal="rent" data-t="deal.rent"></button>
    </div></div>
    <div id="progress"></div>
    <div class="actions">
      <button type="button" class="ghost" id="close-scan" data-t="close"></button>
      <button class="primary" id="go" data-t="scan.start"></button>
    </div>
  </form>
</dialog>

const storage = {
  get: k => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
};
const guess = (navigator.languages || [navigator.language || "en"]).map(l => l.slice(0, 2)).find(l => STRINGS[l]);
let lang = STRINGS[storage.get("lang")] ? storage.get("lang") : (guess || "en");

/* Looks a phrase up in the chosen language, falling back on English. */
const t = (key, vars = {}) =>
  (STRINGS[lang][key] ?? STRINGS.en[key] ?? key).replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? "");

function applyStatic() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(n => n.textContent = t(n.dataset.t));
  document.querySelectorAll("[data-t-placeholder]").forEach(n => n.placeholder = t(n.dataset.tPlaceholder));
  $("lang").innerHTML = Object.entries(LANGUAGES).map(([code, name]) =>
    `<option value="${code}" ${code === lang ? "selected" : ""}>${name}</option>`).join("");
}

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const get = (path, params = {}) =>
  fetch(path + "?" + new URLSearchParams(params)).then(r => r.json());
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const DASH = '<span class="dash">—</span>';

const KIND_KEYS = ["any", "house", "apartment"];
const kindName = k => KIND_KEYS.includes(k) ? t("kind." + k) : k;
const COUNTRIES = {
  fr: { Belgium: "Belgique", Switzerland: "Suisse" },
  nl: { Belgium: "België", Switzerland: "Zwitserland" },
  de: { Belgium: "Belgien", Switzerland: "Schweiz" },
};
const countryName = c => COUNTRIES[lang]?.[c] ?? c;
const typeName = k => STRINGS.en["type." + k] ? t("type." + k) : k;
const currencyOf = country => country === "Switzerland" ? "CHF" : "€";

const num = n => Math.round(n).toLocaleString(lang);
const dec = n => n.toLocaleString(lang, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const money = (n, cur) => n ? `${num(n)} ${cur}` : DASH;
const short = n => !n ? "—" : n >= 1e6 ? dec(n / 1e6).replace(/[.,]?0+$/, "") + "M" : n >= 1e4 ? Math.round(n / 1e3) + "k" : num(n);
const pct = n => n ? dec(n) + "%" : DASH;
const day = iso => iso ? new Date(iso).toLocaleDateString(lang, { day: "numeric", month: "short", year: "numeric" }) : "";
const placeHash = (key, deal) => `#/place/${encodeURIComponent(key)}/${deal}`;

/* ---------- data ---------- */
let searches = [], yields = [], places = [];

/* A place is one country + locality + property type; its sale and rental
   searches are two sides of it, not two places. */
function groupPlaces() {
  const byKey = new Map();
  for (const s of searches) {
    const [country, code, type, deal] = s.search_key.split("/");
    const key = [country, code, type].join("/");
    if (!byKey.has(key)) byKey.set(key, { key, country, code, type, name: code, sides: {} });
    const p = byKey.get(key);
    p.sides[deal] = s;
    if (s.city) p.name = s.city;
  }
  places = [...byKey.values()].sort((a, b) => a.name.localeCompare(b.name));
  for (const p of places) {
    p.isRegion = !/^\d+$/.test(p.code);
    p.yield = yields.find(y => y.country === p.country && y.place === p.code && y.type === p.type);
    p.lastSeen = Object.values(p.sides).map(s => s.last_seen).sort().pop();
  }
}

function showLastScan() {
  const latest = places.map(p => p.lastSeen).sort().pop();
  $("status").textContent = latest ? t("status.last", { d: day(latest) }) : "";
}

async function loadAll() {
  [searches, yields] = await Promise.all([get("/api/searches"), get("/api/yields")]);
  groupPlaces();
  showLastScan();
  drawSide();
  route();
}

/* ---------- sortable tables ---------- */
const sorts = {};
const compare = (a, b) => {
  if (a === b) return 0;
  if (a == null || a === "") return 1;
  if (b == null || b === "") return -1;
  return typeof a === "number" && typeof b === "number" ? a - b : String(a).localeCompare(String(b));
};

/* Draws a table whose headings sort it. Each column gives the value to sort
   on and the cell to show, so ordering never depends on formatting. */
function table(node, id, columns, rows, empty, onRow) {
  const state = sorts[id] || (sorts[id] = { index: null, dir: 1 });
  if (!rows.length) { node.innerHTML = `<div class="empty">${empty}</div>`; return; }
  if (state.index !== null) {
    const of = columns[state.index].get;
    rows = [...rows].sort((a, b) => compare(of(a), of(b)) * state.dir);
  }
  const head = columns.map((c, i) => {
    const arrow = state.index === i ? (state.dir > 0 ? " ↑" : " ↓") : "";
    return `<th data-i="${i}" class="${c.get ? "sortable" : ""} ${c.n ? "n" : ""}">${c.label}${arrow}</th>`;
  }).join("");
  node.innerHTML = `<div class="scroll"><table><thead><tr>${head}</tr></thead><tbody>` +
    rows.map((r, i) => `<tr data-r="${i}" class="${onRow ? "go" : ""}">` +
      columns.map(c => c.cell(r)).join("") + "</tr>").join("") + "</tbody></table></div>";
  node.querySelectorAll("th[data-i]").forEach(th => {
    const i = +th.dataset.i;
    if (!columns[i].get) return;
    th.onclick = () => {
      state.dir = state.index === i ? -state.dir : -1;
      state.index = i;
      table(node, id, columns, rows, empty, onRow);
    };
  });
  if (onRow) node.querySelectorAll("tbody tr").forEach(tr => tr.onclick = e => {
    if (!e.target.closest("a")) onRow(rows[+tr.dataset.r]);
  });
}

const bar = (v, top, pale) =>
  `<td style="width:110px"><div class="bar${pale ? " pale" : ""}" style="width:${(v / top * 100).toFixed(1)}%"></div></td>`;

/* ---------- sidebar ---------- */
function drawSide() {
  const q = $("find").value.trim().toLowerCase();
  const shown = places.filter(p => !q || `${p.name} ${p.code}`.toLowerCase().includes(q));
  const countries = [...new Set(shown.map(p => p.country))].sort();
  $("side").innerHTML = countries.map(c => `<div class="group">${esc(countryName(c))}</div>` +
    shown.filter(p => p.country === c).map(p =>
      `<a class="place" data-key="${esc(p.key)}" href="${placeHash(p.key, p.sides.buy ? "buy" : "rent")}">` +
      `<span>${esc(p.name)}${p.type !== "any" ? ` <small>${kindName(p.type)}</small>` : ""}</span>` +
      `<small>${p.isRegion ? t("side.region") : esc(p.code)}</small></a>`).join("")
  ).join("") || `<div class="empty">${t("side.none")}</div>`;
  markSide();
}
const markSide = () => document.querySelectorAll(".place").forEach(a =>
  a.classList.toggle("on", location.hash.startsWith("#/place/") &&

function viewYield(view) {

/* ---------- map ---------- */
const LEAFLET = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/";
let leaflet, map;

/* Leaflet is only fetched once the map is opened, so the rest of the
   explorer keeps working offline. */
function loadLeaflet() {
  return leaflet || (leaflet = new Promise((resolve, reject) => {
    const css = document.createElement("link");
    css.rel = "stylesheet";
    css.href = LEAFLET + "leaflet.min.css";
    css.integrity = "sha512-h9FcoyWjHcOcmEVkxOfTLnmZFWIH0iZhZT1H2TbOq55xssQGEJHEaIm+PgoUaZbRvQTNTluNOEfb1ZRy6D3BOw==";
    css.crossOrigin = "anonymous";
    const js = document.createElement("script");
    js.src = LEAFLET + "leaflet.min.js";
    js.integrity = "sha512-puJW3E/qXDqYp9IfhAI54BJEaWIfloJ7JWs7OeD5i6ruC9JZL1gERT1wjtwXFlh7CjE7ZJ+/vcRZRkIYIb6p4g==";
    js.crossOrigin = "anonymous";
    js.onload = () => resolve(window.L);
    js.onerror = () => { leaflet = null; reject(new Error("leaflet")); };
    document.head.append(css, js);
  }));
}

/* One hue, cheap to dear: darker on a light map, brighter on a dark one. */
const RAMP = {
  light: ["#b7d3f6", "#86b6ef", "#3987e5", "#1c5cab", "#0d366b"],
  dark: ["#184f95", "#256abf", "#3987e5", "#86b6ef", "#cde2fb"],
};
const UNPRICED = "#9ca3af";

/* Splits the prices into up to five bins of as many localities each, so
   a single dear town cannot wash every other one out to the same tint. */
function bins(values) {
  const sorted = [...values].sort((a, b) => a - b);
  const k = Math.min(5, new Set(sorted).size);
  const cuts = [];
  for (let i = 1; i < k; i++) cuts.push(sorted[Math.floor(i * sorted.length / k)]);
  const binOf = v => cuts.filter(c => v >= c).length;
  const ranges = Array.from({ length: k }, (_, b) => {
    const inside = sorted.filter(v => binOf(v) === b);
    return inside.length ? [inside[0], inside[inside.length - 1]] : null;
  });
  return { binOf, ranges };
}

async function viewMap(view, country, deal) {
  const countries = [...new Set(places.map(p => p.country))].sort();
  country = countries.includes(country) ? country : countries[0];
  deal = deal === "rent" ? "rent" : "buy";
  const hash = (c, d) => `#/map/${encodeURIComponent(c)}/${d}`;

  view.innerHTML = `<h1>${t("map.title")}</h1>
    <p class="sub">${t("map.sub")}</p>
    <div class="controls">
      ${countries.length > 1 ? `<div class="seg">${countries.map(c =>
        `<a class="${c === country ? "on" : ""}" href="${hash(c, deal)}">${esc(countryName(c))}</a>`).join("")}</div>` : ""}
      <div class="seg">${["buy", "rent"].map(d =>
        `<a class="${d === deal ? "on" : ""}" href="${hash(country, d)}">${t("deal." + d)}</a>`).join("")}</div>
    </div>
    <div class="card"><div id="map"></div><div class="legend" id="legend"></div></div>`;
  if (!countries.length) {
    view.querySelector(".card").innerHTML = `<div class="empty">${t("places.empty")}</div>`;
    return;
  }

  let L, towns;
  try {
    [L, towns] = await Promise.all([loadLeaflet(), get("/api/localities", { country, rent_or_buy: deal })]);
  } catch {
    if ($("map")) $("map").parentNode.innerHTML = `<div class="empty">${t("map.offline")}</div>`;
    return;
  }
  if (!$("map")) return;  // the reader moved on while this loaded

  const cur = currencyOf(country), renting = deal === "rent";
  const perM2 = v => renting ? `${dec(v)} ${cur}` : money(v, cur);
  const theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  if (map) try { map.remove(); } catch {}
  map = L.map("map", { scrollWheelZoom: false });
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    maxZoom: 19,
  }).addTo(map);

  if (!towns.length) {
    map.fitBounds(country === "Switzerland" ? [[45.8, 5.95], [47.8, 10.5]] : [[49.5, 2.55], [51.5, 6.4]]);
    $("legend").textContent = t("map.empty");
    return;
  }

  const priced = towns.filter(x => x.median_price_per_m2);
  const { binOf, ranges } = bins(priced.map(x => x.median_price_per_m2));
  // Fewer bins than tints still span the whole ramp, cheapest to dearest.
  const ramp = ranges.length < 2 ? [RAMP[theme][2]]
    : ranges.map((_, b) => RAMP[theme][Math.round(b * 4 / (ranges.length - 1))]);
  const most = Math.max(...towns.map(x => x.listings));
  const ring = getComputedStyle(document.documentElement).getPropertyValue("--card").trim();

  // Biggest drawn first, so a big town never hides its smaller neighbours.
  for (const town of [...towns].sort((a, b) => b.listings - a.listings)) {
    const v = town.median_price_per_m2;
    const marker = L.circleMarker([town.latitude, town.longitude], {
      radius: 6 + 14 * Math.sqrt(town.listings / most),
      color: ring, weight: 2,
      fillColor: v ? ramp[binOf(v)] : UNPRICED, fillOpacity: v ? .9 : .5,
    }).addTo(map);
    marker.bindTooltip(`<b>${esc(town.city)}</b> <span class="dash">${esc(town.postal_code)}</span><br>` +
      `${v ? `<b>${perM2(v)}</b> / m²` : t("map.noSurface")}<br>` +
      `<span class="dash">${t(renting ? "tile.medianRent" : "tile.medianPrice")} ${money(town.median_price, cur)} · ` +
      `${t("map.listings", { n: town.listings })}</span>`, { direction: "top", offset: [0, -6] });
    const key = town.search_key.split("/").slice(0, 3).join("/");
    marker.on("click", () => location.hash = placeHash(key, deal));
  }
  map.fitBounds(towns.map(x => [x.latitude, x.longitude]), { padding: [30, 30], maxZoom: 12 });

  $("legend").innerHTML = `<b>${t(renting ? "map.legendRent" : "map.legendBuy")}</b>` +
    ranges.map((r, b) => r ? `<span class="key"><i style="background:${ramp[b]}"></i>` +
      `${r[0] === r[1] ? perM2(r[0]) : `${perM2(r[0])} – ${perM2(r[1])}`}</span>` : "").join("") +
    (priced.length < towns.length
      ? `<span class="key"><i style="background:${UNPRICED};opacity:.5"></i>${t("map.noSurface")}</span>` : "");
}

let placeTab = "listings";

async function viewPlace(view, key, deal) {
  const p = places.find(x => x.key === key);
  if (!p) {
    view.innerHTML = `<h1>${t("place.notFound")}</h1><p class="sub">${t("place.notFoundSub")} <a href="#/">${t("place.back")}</a></p>`;
    return;
  }
  deal = p.sides[deal] ? deal : (p.sides.buy ? "buy" : "rent");
  const s = p.sides[deal], cur = currencyOf(p.country), renting = deal === "rent";
  const perM2 = v => !v ? DASH : renting ? `${dec(v)} ${cur}` : money(v, cur);

  view.innerHTML = `<div class="crumb"><a href="#/">${t("nav.places")}</a> / ${esc(countryName(p.country))}</div>
    <h1>${esc(p.name)}</h1>
    <p class="sub">${p.isRegion ? t("place.wholeRegion") : t("place.postal", { c: esc(p.code) })} · ${kindName(p.type)} · ${t("place.lastScanned", { d: day(s.last_seen) })}</p>
    <div class="seg" style="margin-bottom:18px">
      ${["buy", "rent"].map(d => `<a class="${d === deal ? "on" : ""} ${p.sides[d] ? "" : "off"}" href="${placeHash(key, d)}">` +
        `${t("deal." + d)}${p.sides[d] ? ` <span class="num">${p.sides[d].listings}</span>` : ""}</a>`).join("")}
    </div>
    <div class="tiles">
      <div class="card tile"><div class="k">${t(renting ? "tile.medianRent" : "tile.medianPrice")}</div><div class="v">${money(s.median_price, cur)}</div>
        <div class="h">${t("tile.average", { v: money(s.mean_price, cur) })}</div></div>
      <div class="card tile"><div class="k">${t("tile.perM2")}</div><div class="v">${perM2(s.median_price_per_m2)}</div>
        <div class="h">${t(renting ? "tile.perMonth" : "tile.asking")}</div></div>
      <div class="card tile"><div class="k">${t("tile.range")}</div><div class="v">${short(s.first_quartile)} – ${short(s.third_quartile)}</div>
        <div class="h">${t(renting ? "tile.rangeRents" : "tile.rangePrices")}</div></div>
      ${p.yield ? `<div class="card tile"><div class="k">${t("tile.yield")}</div><div class="v">${pct(p.yield.gross_yield)}</div>
        <div class="h">${t("tile.onMedians", { v: pct(p.yield.gross_yield_on_medians) })}</div></div>` : ""}
    </div>
    <div class="card">
      <div class="card-head">
        <div class="seg" id="ptabs">
          <button data-tab="listings">${t("tab.listings")}</button>
          <button data-tab="moves">${t("tab.moves")} <span class="num" id="nmoves"></span></button>
        </div>
        <span class="spacer"></span>
        <input id="filter" placeholder="${t("filter")}" size="26" aria-label="${t("filter")}">
      </div>
      <div id="pbody"><div class="empty">${t("loading")}</div></div>
    </div>`;

  const [rows, moves] = await Promise.all([
    get("/api/listings", { search: s.search_key, sort: "price", limit: 1000 }),
    get("/api/movements", { search: s.search_key }),
  ]);
  if (!$("pbody")) return;  // the reader moved on while this loaded
  $("nmoves").textContent = moves.length || "";

  const stamps = rows.flatMap(r => [r.first_seen, r.last_seen]).sort();
  const earliest = stamps[0], latest = stamps[stamps.length - 1];
  const statusOf = r => r.last_seen < latest ? "gone" : (r.first_seen === latest && latest !== earliest ? "new" : "");
  const open = r => openListing(r.platform, r.listing_id, rows, cur);

  const draw = () => {
    const q = $("filter").value.trim().toLowerCase();
    document.querySelectorAll("#ptabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === placeTab));
    $("filter").style.visibility = placeTab === "listings" ? "visible" : "hidden";

    if (placeTab === "moves") {
      const titled = moves.map(m => ({ ...m, title: rows.find(r => r.listing_id === m.listing_id && r.platform === m.platform)?.description || m.listing_id }));
      return table($("pbody"), "moves", [
        { label: t("col.property"), get: r => r.title, cell: r => `<td class="wrap">${esc(r.title)}<span class="second">${esc(r.city)}</span></td>` },
        { label: t("col.was"), n: 1, get: r => r.first_price, cell: r => `<td class="n dash">${money(r.first_price, cur)}</td>` },
        { label: t("col.now"), n: 1, get: r => r.price, cell: r => `<td class="n">${money(r.price, cur)}</td>` },
        { label: t("col.change"), n: 1, get: r => r.price - r.first_price, cell: r => {
            const d = r.price - r.first_price, rel = d / r.first_price * 100;
            return `<td class="n ${d < 0 ? "down" : "up"}">${d < 0 ? "−" : "+"}${num(Math.abs(d))} <span class="dash">(${rel.toLocaleString(lang, { maximumFractionDigits: 1 })}%)</span></td>`; } },
      ], titled, t("moves.empty"), open);
    }

    const shown = rows.filter(r => !q || `${r.description} ${r.source || r.platform} ${r.type} ${typeName(r.type)}`.toLowerCase().includes(q));
    table($("pbody"), "listings", [
      { label: t("col.property"), get: r => r.description,
        cell: r => `<td class="wrap">${esc(r.description || typeName(r.type) || r.listing_id)}<span class="second">${esc(r.source || r.platform)}</span></td>` },
      { label: "", get: statusOf, cell: r => { const st = statusOf(r); return `<td>${st ? `<span class="tag ${st}">${t("tag." + st)}</span>` : ""}</td>`; } },
      { label: t("col.price"), n: 1, get: r => r.price, cell: r => `<td class="n"><b>${money(r.price, cur)}</b></td>` },
      { label: "m²", n: 1, get: r => r.livable_square_meters, cell: r => `<td class="n">${r.livable_square_meters || DASH}</td>` },
      { label: t("col.perM2"), n: 1, get: r => r.price && r.livable_square_meters ? r.price / r.livable_square_meters : null,
        cell: r => `<td class="n">${r.price && r.livable_square_meters ? (renting ? dec(r.price / r.livable_square_meters) : num(r.price / r.livable_square_meters)) : DASH}</td>` },
      { label: t("col.beds"), n: 1, get: r => r.bedrooms_number, cell: r => `<td class="n">${r.bedrooms_number || DASH}</td>` },
      { label: t("col.firstSeen"), get: r => r.first_seen, cell: r => `<td class="dash">${day(r.first_seen)}</td>` },
    ], shown, t("listings.empty"), open);
  };
  document.querySelectorAll("#ptabs button").forEach(b => b.onclick = () => { placeTab = b.dataset.tab; draw(); });
  $("filter").oninput = draw;
  draw();
}

/* ---------- listing drawer ---------- */
async function openListing(platform, id, rows, cur) {
  const r = rows.find(x => x.platform === platform && x.listing_id === id) || {};
  const history = await get("/api/history", { platform, id });
  const d = $("drawer");
  d.innerHTML = `<button class="ghost" id="close-drawer" style="float:right">${t("close")}</button>
    <div class="crumb">${esc(r.source || r.platform)}</div>
    <h2 style="font-size:20px;margin-right:90px">${esc(r.description || id)}</h2>
    <dl class="facts">
      <dt>${t("d.price")}</dt><dd><b>${money(r.price, cur)}</b></dd>
      <dt>${t("d.place")}</dt><dd>${esc(r.postal_code)} ${esc(r.city)}</dd>
      <dt>${t("d.surface")}</dt><dd>${r.livable_square_meters ? r.livable_square_meters + " m²" : DASH}</dd>
      <dt>${t("d.bedrooms")}</dt><dd>${r.bedrooms_number || DASH}</dd>
      <dt>${t("d.type")}</dt><dd>${r.type ? esc(typeName(r.type)) : DASH}</dd>
      <dt>${t("d.seen")}</dt><dd>${day(r.first_seen)} → ${day(r.last_seen)}</dd>
    </dl>
    ${r.url ? `<p><a href="${esc(r.url)}" target="_blank" rel="noreferrer">${t("d.open")}</a></p>` : ""}
    <h2 style="margin-top:22px">${t("d.history")}</h2>
    ${sparkline(history)}
    <table class="hist">${history.map((h, i) => {
      const prev = history[i - 1]?.price, diff = prev ? h.price - prev : 0;
      return `<tr><td>${day(h.seen_at)}</td><td class="n">${money(h.price, cur)}</td>
        <td class="n ${diff < 0 ? "down" : diff > 0 ? "up" : "dash"}">${diff ? (diff < 0 ? "−" : "+") + num(Math.abs(diff)) : "—"}</td></tr>`;
    }).join("")}</table>`;
  d.classList.add("open");
  d.setAttribute("aria-hidden", "false");
  $("close-drawer").onclick = closeDrawer;
}
const closeDrawer = () => { $("drawer").classList.remove("open"); $("drawer").setAttribute("aria-hidden", "true"); };
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });

function sparkline(history) {
  const ps = history.map(h => h.price).filter(Boolean);
  if (ps.length < 2) return "";
  const lo = Math.min(...ps), hi = Math.max(...ps), w = 360, h = 70, pad = 6;
  const y = v => hi === lo ? h / 2 : pad + (hi - v) / (hi - lo) * (h - 2 * pad);
  const step = (w - 2 * pad) / (ps.length - 1);
  let path = `M${pad},${y(ps[0])}`;
  ps.forEach((v, i) => { if (i) path += ` H${pad + i * step} V${y(v)}`; });
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" style="margin:10px 0">
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
    ${ps.map((v, i) => `<circle cx="${pad + i * step}" cy="${y(v)}" r="3.5" fill="var(--accent)"/>`).join("")}</svg>`;
}

/* ---------- routing: #/  #/yield  #/map/<country>/<buy|rent>  #/place/<country/code/type>/<buy|rent> ---------- */
function route() {
  closeDrawer();
  const parts = location.hash.replace(/^#\/?/, "").split("/");
  const view = $("view");
  document.querySelectorAll(".tabs a").forEach(a => a.classList.toggle("on",
    parts[0] !== "place" && a.dataset.tab === (["yield", "map"].includes(parts[0]) ? parts[0] : "places")));
  if (parts[0] === "place") viewPlace(view, decodeURIComponent(parts[1] || ""), parts[2]);
  else if (parts[0] === "yield") viewYield(view);
  else if (parts[0] === "map") viewMap(view, decodeURIComponent(parts[1] || ""), parts[2]);
  else viewPlaces(view);
  markSide();
  window.scrollTo(0, 0);
}

/* ---------- scanning ---------- */
let options = { countries: [], types: [], regions: {} }, scanDeal = "buy";

async function loadOptions() {
  options = await get("/api/options");
  fillOptions();
}

function fillOptions() {
  const fill = (id, values, label = v => v) => {
    const keep = $(id).value;
    $(id).innerHTML = values.map(v => `<option value="${esc(v)}">${esc(label(v))}</option>`).join("");
    if (values.includes(keep)) $(id).value = keep;
  };
  fill("country", options.countries || [], countryName);
  fill("kind", options.types || [], kindName);
  showRegions();
}

/* A region replaces the town rather than narrowing it, so picking one
   disables the town field instead of quietly ignoring it. */
function showRegions() {
  const keep = $("region").value;
  const regions = (options.regions || {})[$("country").value] || [];
  $("region").innerHTML = `<option value="">${t("scan.regionNone")}</option>` +
    regions.map(r => `<option value="${esc(r)}">${esc(r)}</option>`).join("");
  if (regions.includes(keep)) $("region").value = keep;
  pickedRegion();
}
function pickedRegion() {
  $("place").disabled = !!$("region").value;
  $("place").placeholder = t($("place").disabled ? "scan.wholeRegion" : "scan.townHint");
}

const say = (text, fail) => { $("progress").textContent = text; $("progress").className = fail ? "fail" : ""; };

async function poll() {
  const status = await get("/api/scans");
  if (status.state === "running") {
    say(t("status.scanning", { p: status.asked }));
    $("status").textContent = t("status.scanning", { p: status.asked });
    $("go").disabled = true;
    return setTimeout(poll, 1200);
  }
  $("go").disabled = false;
  if (status.state === "done") {
    say(t("scan.done", { p: status.asked, n: status.listings, s: status.summary }));
    await loadAll();
    const [country, code, type, deal] = (status.search_key || "").split("/");
    if (deal) location.hash = placeHash([country, code, type].join("/"), deal);
  } else if (status.state === "failed") {
    say(status.error, true);
  }
}

/* ---------- wiring ---------- */
window.addEventListener("hashchange", route);
$("find").oninput = drawSide;
$("country").onchange = showRegions;
$("region").onchange = pickedRegion;
document.querySelectorAll("#scan [data-deal]").forEach(b => b.onclick = () => {
  scanDeal = b.dataset.deal;
  document.querySelectorAll("#scan [data-deal]").forEach(x => x.classList.toggle("on", x === b));
});
$("open-scan").onclick = () => $("scan").showModal();
$("close-scan").onclick = () => $("scan").close();

$("lang").onchange = () => {
  lang = $("lang").value;
  storage.set("lang", lang);
  applyStatic();
  fillOptions();
  showLastScan();
  drawSide();
  route();
};

$("add").onsubmit = async event => {
  event.preventDefault();
  if (!$("region").value && !$("place").value) return say(t("scan.needPlace"), true);
  say(t("scan.asking"));
  $("go").disabled = true;
  const answer = await fetch("/api/scans", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      country: $("country").value, place: $("place").value, region: $("region").value,
      type: $("kind").value, rent_or_buy: scanDeal,
    }),
  });
  if (!answer.ok) { say(await answer.text(), true); $("go").disabled = false; return; }
  poll();
};

applyStatic();
loadOptions();
loadAll();
poll();
</script>
