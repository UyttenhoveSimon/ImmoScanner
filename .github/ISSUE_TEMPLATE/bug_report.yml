name: Bug report
description: Something other than a portal misbehaves
labels: [bug]
body:
  - type: input
    id: command
    attributes:
      label: Command
      placeholder: immoscanner brrrr Belgium -p 4000
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and platform
      placeholder: immoscanner --version, OS, Python version
