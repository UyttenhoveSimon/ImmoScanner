name: portal capture

# The French and German readers were written without a page of those portals
# to hand. This job, run from GitHub where the portals can be reached, saves
# one result page per portal and what the readers made of it, and publishes
# them on the portal-captures branch: real pages to fix the readers against,
# and the evidence for dropping a portal that only ever serves an anti-bot wall.
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ImmoScanner/Workers/**
      - scripts/capture_portals.py
      - .github/workflows/capture.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --dev
      - run: uv run python -m rustwright install chromium
      - run: uv run python scripts/capture_portals.py captures
      - name: Publish the captures on the portal-captures branch
        working-directory: captures
        run: |
          git init -q -b portal-captures
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Portal captures from run ${{ github.run_id }} of ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" portal-captures
