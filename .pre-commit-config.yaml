# Run with prek (a faster drop-in for pre-commit, installed by `uv sync`):
#   uv run prek install            # once, to run the hooks on every commit
#   uv run prek run --all-files    # what CI runs
# editor settings are not ours to reformat
exclude: ^\.vscode/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      # lint first: its fixes (imports, f-strings...) are then formatted
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.5
    hooks:
      # pyproject.toml and uv.lock must never drift apart
      - id: uv-lock
